[project]
name = "batterie"
version = "0.1.0"
description = "Batterie virtuelle pour Windows : clavier, partitions, puis vision par caméra."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pygame-ce>=2.5",
    "platformdirs>=4.0",
    "tomli-w>=1.0",
]

[project.scripts]
batterie = "batterie.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/batterie"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
